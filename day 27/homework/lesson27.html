<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .a1:link{
            color: rgb(255, 0, 0);
            background-color: rgb(252, 211, 211);
        }

        .a1:visited{
            color:rgb(0, 255, 0) ;
        }

        .a1:hover{
            color: blue;
            border: 1px solid blue;
        }

        .a2{
            color: rgb(138, 90, 182);
            text-decoration: underline solid rgb(14, 153, 14);

        }

        .a3{
            display: inline-block;
            width: 100px;
            height: 60px;
            background-color: mediumblue;
            color: white;
            text-align: center;
            line-height: 60px;
        }

    </style>
</head>
<body>

    <!-- css ში გასასტილად რასაც ვიყენებთ მაგალითად color, background color weight height border text aling და ასე შემდეგ -->

    <a  class="a1" href="https://github.com/">Link Text</a>
    <p> This is a
    <a  class="a2" href="https://github.com/">styled link</a>
    .
    </p>
    <a  class="a3" href="https://github.com/">Link Text</a>

</body>
</html>
