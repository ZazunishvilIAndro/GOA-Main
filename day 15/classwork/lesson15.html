<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <label for="menu" style="font-family: Arial; font-weight: bold;">
  Dropdown
</label>
<br><br>

<select id="menu"
  style="
    width: 220px;
    padding: 10px;
    border: 3px solid #3b82f6;
    border-radius: 10px;
    font-size: 15px;">
  <option>Item 1</option>
  <option>Item 2</option>
  <option>Item 3</option>
</select>


<!-- select tag გამოიყენება ჩამოსაშლელი მენიუს dropdown menu შესაქმნელად -->
<!-- label tag  გამოიყენება input ან select ელემენტის დასახელებისთვის  -->
<!-- id ატრიბუტი არის ელემენტის უნიკალური იდენტიფიკატორი html დოკუმენტში -->


</body>
</html>
